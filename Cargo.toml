[package]
name = "payjp-cli"
version = "0.1.0"
edition = "2021"
authors = ["PAY.JP CLI Contributors"]
description = "CLI tool for PAY.JP payment service API"
repository = "https://github.com/penguin425/payjp-rust-cli"
license = "MIT"
keywords = ["payjp", "payment", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
tabled = "0.17"
colored = "2"
dirs = "5"
toml = "0.8"
urlencoding = "2"
rand = "0.8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lib]
name = "payjp_cli"
path = "src/lib.rs"

[[bin]]
name = "payjp"
path = "src/main.rs"
